<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Docker Application</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 600px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            text-align: center;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background: #0056b3;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #eee;
            margin: 10px 0;
            padding: 12px;
            border-radius: 5px;
        }

        .status {
            text-align: center;
            margin-top: 15px;
            color: green;
        }

        .error {
            color: red;
        }

    </style>

</head>


<body>

    <div class="container">

        <h1>Docker Application</h1>


        <div class="input-area">

            <input
                type="text"
                id="dockerInput"
                placeholder="Enter a Docker topic..."
            >

            <button onclick="addDocker()">
                Add
            </button>

        </div>


        <div
            class="status"
            id="status">
        </div>


        <ul id="dockerList"></ul>

    </div>


    <script>

        /*
         * Docker API
         */
        const API_URL = "http://3.84.11.241:5000";


        /*
         * Add Docker topic
         */
        async function addDocker() {

            const input = document.getElementById("dockerInput");
            const status = document.getElementById("status");

            const docker = input.value.trim();


            if (!docker) {

                status.textContent =
                    "Please enter a Docker topic";

                status.className = "status error";

                return;
            }


            status.textContent = "Adding Docker topic...";
            status.className = "status";


            try {

                const response = await fetch(
                    `${API_URL}/topics`,
                    {
                        method: "POST",

                        headers: {
                            "Content-Type": "application/json"
                        },

                        body: JSON.stringify({
                            docker: docker
                        })
                    }
                );


                const data = await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.error || "Unable to add Docker topic"
                    );
                }


                status.textContent =
                    "Docker topic added successfully";

                status.className = "status";


                input.value = "";


                /*
                 * Reload topic list
                 */
                loadDockerTopics();


            } catch (error) {

                console.error(
                    "Error adding Docker topic:",
                    error
                );

                status.textContent =
                    "Unable to add Docker topic";

                status.className = "status error";
            }
        }


        /*
         * Load Docker topics
         */
        async function loadDockerTopics() {

            const list =
                document.getElementById("dockerList");


            try {

                const response = await fetch(
                    `${API_URL}/topics`
                );


                if (!response.ok) {

                    throw new Error(
                        "Unable to fetch topics"
                    );
                }


                const topics =
                    await response.json();


                list.innerHTML = "";


                topics.forEach(topic => {

                    const li =
                        document.createElement("li");

                    li.textContent =
                        topic.docker;

                    list.appendChild(li);

                });


            } catch (error) {

                console.error(
                    "Error loading topics:",
                    error
                );

                list.innerHTML =
                    "<li>Unable to load Docker topics</li>";
            }
        }


        /*
         * Load topics when page opens
         */
        window.addEventListener(
            "load",
            loadDockerTopics
        );


        /*
         * Allow Enter key to add topic
         */
        document
            .getElementById("dockerInput")
            .addEventListener("keydown", function(event) {

                if (event.key === "Enter") {

                    addDocker();

                }

            });

    </script>

</body>

</html>
