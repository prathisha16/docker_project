<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Docker Application</title>


    <style>
        <script>

async function addDocker() {

    const input = document.getElementById("dockerInput");
    const status = document.getElementById("status");

    const docker = input.value.trim();

    if (!docker) {
        status.textContent = "Please enter a Docker topic";
        return;
    }

    try {

        const response = await fetch("http://YOUR_EC2_PUBLIC_IP:5000/topics", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                docker: docker
            })
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Unable to add Docker topic");
        }

        status.textContent = "Docker topic added successfully";

        input.value = "";

        loadDockerTopics();

    } catch (error) {

        console.error(error);

        status.textContent = "Unable to add Docker topic";
    }
}


async function loadDockerTopics() {

    try {

        const response = await fetch(
            "http://YOUR_EC2_PUBLIC_IP:5000/topics"
        );

        const topics = await response.json();

        const list = document.getElementById("dockerList");

        list.innerHTML = "";

        topics.forEach(topic => {

            const li = document.createElement("li");

            li.textContent = topic.docker;

            list.appendChild(li);

        });

    } catch (error) {

        console.error("Unable to load topics:", error);

    }
}


window.addEventListener("load", loadDockerTopics);

</script>

        body {

            font-family: Arial, sans-serif;

            background: #f4f4f4;

            margin: 0;

            padding: 0;

        }


        .container {

            width: 600px;

            margin: 60px auto;

            background: white;

            padding: 30px;

            border-radius: 10px;

            box-shadow: 0 0 10px #ccc;

        }


        h1 {

            text-align: center;

        }


        .input-area {

            display: flex;

            gap: 10px;

        }


        input {

            flex: 1;

            padding: 12px;

            font-size: 16px;

        }


        button {

            padding: 12px 20px;

            cursor: pointer;

            background: #007bff;

            color: white;

            border: none;

            border-radius: 5px;

        }


        button:hover {

            background: #0056b3;

        }


        ul {

            list-style: none;

            padding: 0;

        }


        li {

            background: #eee;

            margin: 10px 0;

            padding: 12px;

            border-radius: 5px;

        }


        .status {

            text-align: center;

            margin-top: 15px;

            color: green;

        }

    </style>

</head>


<body>


<div class="container">


    <h1>Docker Application</h1>


    <div class="input-area">

        <input
            type="text"
            id="dockerInput"
            placeholder="Enter a Docker topic..."
        >


        <button onclick="addDocker()">

            Add

        </button>

    </div>


    <div
        class="status"
        id="status">
    </div>


    <ul id="dockerList"></ul>


</div>



<script>


/*
 * Load Docker topics
 */

async function loadDocker() {

    try {

        const response = await fetch("/api/docker");


        if (!response.ok) {

            throw new Error(
                "API request failed"
            );

        }


        const dockerItems =
            await response.json();


        const list =
            document.getElementById(
                "dockerList"
            );


        list.innerHTML = "";


        dockerItems.forEach(item => {

            const li =
                document.createElement("li");


            li.innerHTML = `

                <strong>${item.id}</strong>
                - ${escapeHtml(item.docker)}

            `;


            list.appendChild(li);

        });


    } catch (error) {

        document.getElementById(
            "status"
        ).innerText =
            "Unable to connect to API";


        console.error(error);

    }

}



/*
 * Add Docker topic
 */

async function addDocker() {


    const input =
        document.getElementById(
            "dockerInput"
        );


    const docker =
        input.value.trim();


    if (!docker) {

        alert(
            "Please enter a Docker topic"
        );

        return;

    }


    try {


        const response =
            await fetch(
                "/api/docker",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        docker: docker

                    })

                }
            );


        if (!response.ok) {

            throw new Error(
                "Failed to add Docker topic"
            );

        }


        input.value = "";


        document.getElementById(
            "status"
        ).innerText =
            "Docker topic added successfully";


        loadDocker();


    } catch (error) {


        document.getElementById(
            "status"
        ).innerText =
            "Unable to add Docker topic";


        console.error(error);

    }

}



/*
 * Escape HTML
 */

function escapeHtml(text) {


    const div =
        document.createElement("div");


    div.textContent = text;


    return div.innerHTML;

}



/*
 * Load data when page opens
 */

loadDocker();


</script>


</body>

</html>
